[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "system-loopback"
version = "0.1.0"
description = "Zero-driver cross-platform system audio loopback capture (macOS Core Audio Tap, Windows WASAPI, Linux PipeWire/PulseAudio) for Python Voice AI, AEC, and transcription."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "huangjunsen0406" },
]
keywords = ["audio", "loopback", "aec", "coreaudio", "wasapi", "pulseaudio", "pipewire", "voice-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/huangjunsen0406/system-loopback"
Repository = "https://github.com/huangjunsen0406/system-loopback"
Issues = "https://github.com/huangjunsen0406/system-loopback/issues"

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
aec = ["numpy>=1.24", "soxr>=0.3.7"]
dev = ["pytest>=7.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
system_loopback = ["_libs/**/*"]
