[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "system-loopback"
version = "0.1.0"
description = "Cross-platform system audio loopback capture (macOS Core Audio Tap, Windows WASAPI, Linux PulseAudio/PipeWire) with zero virtual audio drivers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["audio", "loopback", "aec", "coreaudio", "wasapi", "pulseaudio", "pipewire", "voice-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
aec = ["numpy>=1.24", "soxr>=0.3.7"]
dev = ["pytest>=7.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
system_loopback = ["_libs/**/*"]
